[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orthrus_cp"
version = "0.0.1"
description = "Orthrus + CP-cluster head: head-only training on a frozen Orthrus backbone"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.10.0",
    "transformers>=5.8.0",
    "accelerate>=1.13.0",
    "datasets>=3.0.0",
    "numpy",
    "scikit-learn>=1.3",
    "hydra-core>=1.3",
    "tensorboard>=2.14",
    "loguru",
    "tqdm",
]

[tool.setuptools.packages.find]
include = ["ocp*"]

[tool.uv.sources]
orthrus = { path = "../orthrus", editable = true }
